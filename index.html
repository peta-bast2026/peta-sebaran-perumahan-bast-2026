
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Sebaran Perumahan BAST 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;padding:0;font-family:Arial,sans-serif}
header{padding:14px;background:#174a35;color:white}
h2{margin:0;font-size:19px}
#info{padding:12px;background:#f1f5f2;font-size:14px}
#map{height:75vh;width:100%}
</style>
</head>
<body>
<header><h2>Peta Sebaran Perumahan BAST 2026</h2></header>
<div id="info">Memuat data kawasan perumahan...</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([-4.0,122.5],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

const params=new URLSearchParams(location.search);
const fitur=params.get('fitur');

fetch('Kawasan_WGS84.geojson')
.then(response=>{
  if(!response.ok) throw new Error('File GeoJSON tidak ditemukan');
  return response.json();
})
.then(data=>{
  const features=data.features||[];
  const index=fitur===null?-1:Number(fitur)-1;
  const valid=Number.isInteger(index)&&index>=0&&index<features.length;
  const selected=valid?[features[index]]:features;

  const layer=L.geoJSON(selected,{
    style:function(){
      return {
        color:valid?'#e00000':'#176b42',
        weight:valid?4:2,
        fillColor:valid?'#ffcc00':'#55aa77',
        fillOpacity:0.45
      };
    },
    onEachFeature:function(feature,layer){
      const p=feature.properties||{};
      const nama=p.KETERANGAN||'Nama kawasan tidak tersedia';
      const id=p.id??'-';
      layer.bindPopup('<b>'+nama+'</b><br>ID: '+id);
    }
  }).addTo(map);

  if(layer.getBounds().isValid()){
    map.fitBounds(layer.getBounds(),{padding:[30,30]});
  }

  if(valid){
    const p=features[index].properties||{};
    document.getElementById('info').innerHTML=
      '<b>Kawasan terpilih:</b> '+(p.KETERANGAN||'-')+
      '<br><b>ID:</b> '+(p.id??'-')+
      '<br><b>Nomor bidang:</b> '+fitur+' dari '+features.length;
  }else{
    document.getElementById('info').innerHTML=
      '<b>Peta seluruh kawasan perumahan</b><br>Jumlah bidang: '+features.length;
  }
})
.catch(error=>{
  document.getElementById('info').innerHTML=
    'Gagal memuat data peta. Pastikan file Kawasan_WGS84.geojson sudah diunggah.';
  console.error(error);
});
</script>
</body>
</html>
